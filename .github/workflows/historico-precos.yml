name: Histórico de preços

# Tarefas pesadas que correm aqui e não na Vercel (no plano Hobby a Vercel
# só dá 4 h de CPU ativo por mês; num repositório público os minutos dos
# Actions são grátis):
#   - cron-historico-precos (1, 2 e 3): histórico diário de preços dos
#     supermercados, às 07:17, 13:17 e 19:17 UTC;
#   - cron-paginas-marca: páginas /produto, /marca, os produtos de marca de
#     /precos/[artigo] e o índice /marcas, para a tabela paginas_marca
#     (lib/paginasMarca), às 00:40 UTC.
#
# Os agendamentos do GitHub atrasam horas ou falham de todo (a 9 nov o
# agendador deste repositório parou mais de 15 h). Por isso quem acorda o
# workflow de hora a hora é o pg_cron do Supabase (função
# chamar_planeador_github, ao minuto 37, com "planear"), e o agendamento
# do GitHub fica só de reserva. Em cada execução, o
# scripts/cron/planear.mjs escolhe a primeira tarefa que já devia ter
# corrido hoje e ainda não correu com sucesso (lib/cronsGithub). Quando não
# há nada a fazer, termina em segundos.
#
# Cada execução fica no /admin (Qualidade → Tarefas automáticas). Se uma
# tarefa falhar, o GitHub manda email e a hora seguinte tenta outra vez.
#
# Correr à mão: Actions → "Histórico de preços" → Run workflow.
on:
  schedule:
    - cron: '7 * * * *'   # de hora a hora, ao minuto 7 (fora do :00, a hora mais carregada)
  workflow_dispatch:
    inputs:
      rota:
        description: Tarefa a correr
        type: choice
        options: [planear, cron-historico-precos, cron-historico-precos-2, cron-historico-precos-3, cron-paginas-marca, ensaio-lojas]
        default: planear
  # Mudanças no scraping ou nestes scripts: só o ensaio (não escreve nada).
  push:
    paths:
      - '.github/workflows/historico-precos.yml'
      - 'scripts/cron/**'
      - 'lib/supermercados/**'

permissions:
  contents: read

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Uma tarefa de cada vez: a hora seguinte espera pela anterior.
    concurrency:
      group: historico-precos
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Escolher a tarefa
        id: tarefa
        env:
          EVENTO: ${{ github.event_name }}
          ROTA_MANUAL: ${{ inputs.rota }}
        run: |
          case "$EVENTO:$ROTA_MANUAL" in
            schedule:*|workflow_dispatch:planear) node scripts/cron/planear.mjs ;;
            workflow_dispatch:*)                  echo "args=$ROTA_MANUAL" >> "$GITHUB_OUTPUT" ;;
            *)                                    echo "args=ensaio-lojas" >> "$GITHUB_OUTPUT" ;;
          esac

      # Três tentativas: uma falha passageira do registo do npm não pode
      # fazer perder a tarefa.
      - name: Instalar dependências
        if: steps.tarefa.outputs.args != ''
        run: |
          for i in 1 2 3; do
            npm ci --ignore-scripts --no-audit --no-fund && exit 0
            echo "npm ci falhou (tentativa $i); nova tentativa em $((i * 20)) s"
            sleep $((i * 20))
          done
          exit 1

      - name: Ensaio das lojas
        if: steps.tarefa.outputs.args == 'ensaio-lojas'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/cron/carregador.mjs scripts/cron/ensaio-lojas.mjs

      - name: Correr ${{ steps.tarefa.outputs.args }}
        if: steps.tarefa.outputs.args != '' && steps.tarefa.outputs.args != 'ensaio-lojas'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/cron/carregador.mjs scripts/cron/correr.mjs ${{ steps.tarefa.outputs.args }}
