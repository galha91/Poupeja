name: Recolher pesquisas (auditoria temporária)

on:
  push:
    branches: [claude/auditoria-relevancia]
    paths: [scripts/recolher-pesquisas.mjs, .github/workflows/recolher-pesquisas.yml]

permissions:
  contents: write

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/recolher-pesquisas.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auditoria/pesquisas.json
          git commit -m "auditoria: pesquisas reais do catálogo [skip ci]"
          git push
