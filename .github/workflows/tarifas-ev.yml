name: Tarifas dos postos EV

# Lê os feeds abertos do MOBI.E (NAP Portugal) e guarda no Supabase as
# tarifas de cada posto, para o simulador de carregamento estimar o custo.
# Corre aqui e não no Vercel: os feeds têm ~220 MB e uma função do Vercel
# só tem 60 s. As tarifas mudam pouco; de 6 em 6 horas chega.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarifas-ev
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar o extractor
        run: python3 -m unittest scripts/test_tarifas_ev.py

      - name: Descarregar feeds MOBI.E e guardar tarifas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/tarifas_ev.py
