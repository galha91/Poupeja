name: Testar links

on:
  schedule:
    - cron: '0 7 * * 1'  # Segunda-feira 07:00 UTC
    - cron: '0 8 * * 3'  # Quarta-feira 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Todos os links que o utilizador vê — apoios, folhetos, lojas,
      # promoções e parceiros —, com GET e detecção de "página não
      # encontrada" servida com 200. O resultado fica no resumo da execução.
      - name: Testar links
        id: teste_links
        run: node scripts/verificar-links.mjs

      - name: Alertar sobre links quebrados
        if: steps.teste_links.outputs.quebrados != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QUEBRADOS: ${{ steps.teste_links.outputs.quebrados }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️  RESEND_API_KEY não configurada."
            exit 0
          fi
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"PoupeJá <noreply@xn--poupej-uta.com>\",
              \"to\": [\"ricardogalha1@hotmail.com\"],
              \"subject\": \"⚠️ PoupeJá — links quebrados\",
              \"html\": \"<p>Links quebrados: <strong>$QUEBRADOS</strong></p><p><a href='https://xn--poupej-uta.com/admin'>Abrir painel admin</a></p>\"
            }"
