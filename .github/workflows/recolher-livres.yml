name: Recolher pesquisas livres (temporário)
on:
  push:
    branches: [claude/pesquisas-livres]
    paths: [scripts/recolher-livres.mjs, .github/workflows/recolher-livres.yml]
permissions:
  contents: write
jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/recolher-livres.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auditoria/livres.json
          git commit -m "auditoria: pesquisas livres [skip ci]"
          git push
