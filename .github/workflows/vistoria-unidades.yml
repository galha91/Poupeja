# TEMPORÁRIO — corre a vistoria de unidades num servidor com acesso aos
# sites dos supermercados. Remover antes do merge.
name: Vistoria unidades

on:
  push:
    branches: [claude/unidades-comparacao]
    paths: [scripts/vistoria-unidades.mjs, .github/workflows/vistoria-unidades.yml]

permissions:
  contents: read

jobs:
  vistoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --no-warnings scripts/vistoria-unidades.mjs
