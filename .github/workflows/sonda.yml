name: sonda (temporário)
on:
  push:
    branches: [claude/loading-display-timing-okdgfz]
    paths: ["sonda/**", ".github/workflows/sonda.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node sonda/sonda.mjs ${{ vars.SONDA || 'tudo' }}
