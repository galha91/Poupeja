name: sonda (temporário)
on:
  push:
    branches: [claude/loading-display-timing-okdgfz]
    paths: ["sonda/**", "lib/supermercados/**", ".github/workflows/sonda.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import ./sonda/reg.mjs sonda/motor.mjs
