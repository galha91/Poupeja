name: Reserva dos crons da Vercel

# O plano Hobby da Vercel não repete um cron que falhou nem garante a hora.
# Este workflow chama, ao fim da manhã, as tarefas diárias com ?reserva=1:
# a rota só corre se não tiver corrido nas últimas 20 h (ver lib/cronRegisto.js).
# Se a Vercel correu normalmente, isto não faz nada.
#
# Precisa de dois secrets no GitHub (Settings → Secrets and variables → Actions):
#   CRON_SECRET  — o mesmo valor do CRON_SECRET na Vercel
#   SITE_URL     — opcional; por omissão https://xn--poupej-uta.com
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

jobs:
  reserva:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rota: [cron-saude-precos, cron-lembrete-compras]
    steps:
      - name: Chamar ${{ matrix.rota }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Falta o secret CRON_SECRET"; exit 1; fi
          base="${SITE_URL:-https://xn--poupej-uta.com}"
          code=$(curl -sS --max-time 70 --retry 2 --retry-delay 5 -o resposta.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$base/api/${{ matrix.rota }}?reserva=1")
          echo "HTTP $code"; cat resposta.json; echo
          [ "$code" = "200" ]
