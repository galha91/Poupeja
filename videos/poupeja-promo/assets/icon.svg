  <rect x="165" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <rect x="215" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <rect x="268" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <!-- Tail -->
  <path d="M112 260 Q80 240 90 210 Q100 180 120 200" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Coin -->
