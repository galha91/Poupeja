      <stop offset="0%" style="stop-color:#084c39"/>
      <stop offset="100%" style="stop-color:#0b6b4f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- Piggy bank body -->
  <ellipse cx="256" cy="280" rx="145" ry="120" fill="white" opacity="0.95"/>
  <!-- Head -->
  <circle cx="370" cy="220" r="65" fill="white" opacity="0.95"/>
