<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Tokens reais do PoupeJá (styles/globals.css) */
  :root {
    --brand:      #0b6b4f;
    --brand-deep: #084a37;
    --mint:       #57b392;
    --cream:      #f6f5f0;
    --gold:       #f0a91e;
  }

  html, body { width: 1024px; height: 500px; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--brand-deep);
    position: relative;
    overflow: hidden;
  }

  /* O mesmo brilho em diagonal que o ícone tem — não é um gradiente
     decorativo qualquer, é o que já existe na identidade. */
  .luz {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 78% 18%, #0f7d5c 0%, rgba(15,125,92,0) 58%),
      linear-gradient(135deg, #0a5c44 0%, #084a37 100%);
  }

  /* Fio de cêntimos: uma régua fina que atravessa o fundo, ecoando a
     escala de preços da app. Fica quase invisível — é textura, não
     informação. */
  .regua {
    position: absolute; left: 0; right: 0; bottom: 0; height: 132px;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(246,245,240,.13) 0 1px,
      transparent 1px 26px
    );
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, transparent 100%);
  }

  .palco {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 84px;
    gap: 40px;
  }

  /* ---- coluna de texto ---- */

  .marca {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }

  .pt {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--brand-deep);
    background: var(--mint);
    padding: 5px 11px 4px;
    border-radius: 7px;
    line-height: 1;
  }

  .desde {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(246,245,240,.52);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 116px;
    line-height: .92;
    letter-spacing: -.022em;
    color: var(--cream);
  }
  h1 .ja { color: var(--mint); }

  p {
    margin-top: 30px;
    font-size: 28px;
    line-height: 1.34;
    font-weight: 400;
    color: rgba(246,245,240,.8);
    max-width: 17.5em;
  }
  p b { font-weight: 600; color: var(--cream); }

  /* ---- porquinho ---- */

  .porco {
    flex-shrink: 0;
    width: 342px;
    height: 270px;
    filter: drop-shadow(0 26px 44px rgba(0,0,0,.34));
  }
  .porco img { width: 100%; height: 100%; display: block; }
</style>

<div class="luz"></div>
<div class="regua"></div>

<div class="palco">
  <div class="texto">
    <!--
      Aqui esteve "Grátis · sem anúncios". Era verdade (não há AdMob nem
      adsbygoogle no projeto — o Awin é atribuição de afiliados, não
      publicidade), mas a política de metadados da Google desaconselha
      texto de preço ou promoção nos gráficos da ficha. Fica só o
      distintivo PT, que já é um elemento do cabeçalho da própria app.
    -->
    <div class="marca">
      <span class="pt">PT</span>
    </div>

    <h1>Poupe<span class="ja">Já</span></h1>

    <p>Folhetos, combustível e a poupança que <b>já fizeste</b>.</p>
  </div>

  <div class="porco"><svg xmlns="http://www.w3.org/2000/svg" viewBox="70 135 380 300" width="100%" height="100%">
  <ellipse cx="256" cy="280" rx="145" ry="120" fill="white" opacity="0.95"/>
  <circle cx="370" cy="220" r="65" fill="white" opacity="0.95"/>
  <ellipse cx="350" cy="165" rx="22" ry="16" fill="#3f9070"/>
  <circle cx="385" cy="208" r="8" fill="#14231c"/>
  <ellipse cx="408" cy="235" rx="18" ry="14" fill="#3f9070"/>
  <circle cx="403" cy="232" r="4" fill="#14231c"/>
  <circle cx="413" cy="232" r="4" fill="#14231c"/>
  <rect x="225" y="165" width="55" height="10" rx="5" fill="#0b6b4f"/>
  <rect x="165" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <rect x="215" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <rect x="268" y="375" width="32" height="45" rx="10" fill="white" opacity="0.9"/>
  <path d="M112 260 Q80 240 90 210 Q100 180 120 200" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
  <circle cx="175" cy="295" r="28" fill="#fbbf24"/>
  <text x="175" y="303" text-anchor="middle" font-size="26" font-weight="bold" fill="#92400e" font-family="DM Sans, sans-serif">€</text>
</svg></div>
</div>
